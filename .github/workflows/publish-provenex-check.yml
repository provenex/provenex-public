name: Publish Provenex Check

on:
  push:
    tags:
      - "provenex-check-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin an npm CLI with trusted-publishing support
        run: npm install --global npm@12.0.2
      - name: Require the tag to match package.json
        working-directory: cli/provenex-check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "provenex-check-v$version"
      - name: Test the exact publish boundary
        working-directory: cli/provenex-check
        run: npm test && npm run check:pack
      - name: Publish with npm trusted publishing
        working-directory: cli/provenex-check
        run: npm publish --access public
