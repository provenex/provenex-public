name: Publish Provenex Check

on:
  push:
    tags:
      - "provenex-check-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin an npm CLI with trusted-publishing support
        run: npm install --global npm@12.0.2
      - name: Require the tag to match package.json
        working-directory: cli/provenex-check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "provenex-check-v$version"
      - name: Test the exact publish boundary
        working-directory: cli/provenex-check
        run: npm test && npm run check:pack
      # --tag is REQUIRED, not optional. npm 12 refuses to publish a prerelease
      # without one, and this package's versions are all prereleases:
      #
      #   npm error You must specify a tag using --tag when publishing a
      #   prerelease version.
      #
      # `latest` is deliberate and matches the established convention: 0.1.0-alpha.2
      # already occupies `latest`, and both the README and provenex.ai tell people
      # to run a bare `npx @provenex/check`, which resolves through `latest`.
      # Publishing to a side tag instead would leave every one of those users on
      # the previous alpha while the new one sat unreachable behind a tag nobody
      # was told to type.
      - name: Publish with npm trusted publishing
        working-directory: cli/provenex-check
        run: npm publish --access public --tag latest
