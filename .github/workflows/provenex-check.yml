name: Provenex Check CLI

# No pull_request path filter, for the same reason as sample-assets.yml: `test`
# is a required check on main, and a required check that cannot report on a
# given pull request blocks it permanently rather than skipping it.
#
# Matrix cells report as `test (ubuntu-latest, 22)` and similar. Branch
# protection still requires the unsuffixed name `test`, so a rollup job with
# that name must always run (including after a matrix failure) or the PR stays
# pending forever.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/provenex-check.yml"
      - "cli/provenex-check/**"

permissions:
  contents: read

jobs:
  test-matrix:
    name: test (${{ matrix.os }}, ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
        exclude:
          # One Windows cell is enough; Node 24 on Windows is covered by ubuntu.
          - os: windows-latest
            node-version: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Test public CLI
        working-directory: cli/provenex-check
        run: npm test
      - name: Validate publishable package
        working-directory: cli/provenex-check
        run: npm run check:pack

  test:
    needs: test-matrix
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All matrix cells passed
        run: test "${{ needs.test-matrix.result }}" = "success"
