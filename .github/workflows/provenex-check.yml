name: Provenex Check CLI

on:
  pull_request:
    paths:
      - ".github/workflows/provenex-check.yml"
      - "cli/provenex-check/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/provenex-check.yml"
      - "cli/provenex-check/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test public CLI
        working-directory: cli/provenex-check
        run: npm test
      - name: Validate publishable package
        working-directory: cli/provenex-check
        run: npm run check:pack
