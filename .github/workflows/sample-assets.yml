name: Public sample assets

on:
  pull_request:
    paths:
      - ".github/workflows/sample-assets.yml"
      - "benchmarks/**"
      - "docs/**"
      - "samples/**"
      - "README.md"
      - "SECURITY.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sample-assets.yml"
      - "benchmarks/**"
      - "docs/**"
      - "samples/**"
      - "README.md"
      - "SECURITY.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate public sample packaging
        run: python3 -m unittest -v samples/test_public_assets.py
      - name: Validate runner syntax
        run: bash -n samples/try-me.sh
